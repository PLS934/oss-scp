services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${PLATFORM_DB_NAME:-oss_scp}
      POSTGRES_USER: ${PLATFORM_DB_USER:-oss_scp_app}
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD must be set}
    volumes:
      - platform_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    image: oss-scp-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      OSS_SCP_CONFIG_ROOT: /config
      PLATFORM_DB_TYPE: postgres
      PLATFORM_DB_HOST: postgres
      PLATFORM_DB_PORT: "5432"
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME:-oss_scp}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER:-oss_scp_app}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD must be set}
      PLATFORM_DB_TLS_MODE: disable
      # 계정관리는 기본 비활성화다. 활성화는 compose.auth.example.yaml overlay를 사용한다.
      AUTH_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - ${OSS_SCP_CONFIG_PATH:?OSS_SCP_CONFIG_PATH must be set}:/config:ro
  web:
    image: oss-scp-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-api:3000}
    ports:
      - "0.0.0.0:${WEB_PORT:-8080}:8080"
  mock-api:
    profiles: [mock]
    image: oss-scp-mock-api:local
    build:
      context: .
      dockerfile: apps/mock-api/Dockerfile
    environment:
      MOCK_HOST: 0.0.0.0
      MOCK_PORT: "3001"
    ports:
      - "127.0.0.1:${MOCK_PUBLISHED_PORT:-3001}:3001"

volumes:
  platform_db_data:

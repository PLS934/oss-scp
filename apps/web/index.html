<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let preference = 'system';
        try { preference = localStorage.getItem('oss-scp.theme'); } catch { /* Storage can be disabled. */ }
        const theme = preference === 'light' || preference === 'dark' ? preference
          : typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <style>html { background: #f4f6f8; } html[data-theme="dark"] { background: #101820; }</style>
    <title>OSS-SCP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

schema: spec-driven

context: |
  외부 자산·취약점 정보를 수집해 통합 관리하는 오픈소스 플랫폼이다.
  보안팀은 운영과 담당자 지정을, 개발팀은 관련 취약점 조회를 담당한다.
  원천 데이터는 수정하지 않으며, 수집·저장한 결과를 API로 제공한다.
  계정 연동은 선택 사항이며 특정 조직의 인프라를 설치 필수 조건으로 삼지 않는다.

  서버는 TypeScript + NestJS, 클라이언트는 TypeScript + React + Vite를 사용한다.
  Node.js 24 LTS와 pnpm workspace를 사용하고 앱 개발은 로컬에서 진행한다.
  Docker는 배포 및 개발 도구 없는 환경의 실행용으로 제공한다.
  서버 실행·도구 버전은 docs/server-development.md,
  검증 결과는 docs/server-verification.md,
  브랜치·릴리스 규칙은 docs/development-workflow.md를 따른다.

  산출물 본문은 한국어로 작성하되 OpenSpec 구조 제목과 SHALL/MUST는 유지한다.
  확정된 요구사항과 가정·미결정 사항을 구분한다.

rules:
  proposal:
    - 해결할 문제, 사용자, 기대 효과와 변경·제외 범위를 명시한다.
  specs:
    - 관찰·검증 가능한 동작과 관련된 정상·실패 시나리오를 작성한다.
    - 외부에서 제공하는 정보와 플랫폼에서 관리하는 정보를 구분한다.
  design:
    - 주요 선택의 근거·대안·제약을 설명하고 현재 요구에 불필요한 추상화는 피한다.
    - 연동 변경 시 식별·중복·갱신·누락·실패 처리와 담당자 정보 보존을 검토한다.
  tasks:
    - 완료를 확인할 수 있는 단위로 나누고 의존성과 검증 방법을 포함한다.
    - 동작 변경에는 자동화 테스트를, 버그 수정에는 회귀 테스트를 포함한다.

operations:
  apply:
    guidance:
      - 구현 전에 관련 명세·설계·기존 코드를 확인하고 불일치는 함께 정리한다.
      - 변경에 필요한 테스트·린트·빌드를 실행하고 GitHub Actions와 일치시킨다.
      - 정상·주요 실패 조건을 검증하고 결과와 미실행 사유를 보고한다. 문서만 바뀌면 테스트 코드 추가는 생략할 수 있다.
  archive:
    guidance:
      - 작업·검증 완료와 변경 명세의 본 명세 반영 여부를 확인한다.
      - 미완료 항목을 완료로 처리하지 않고 남은 작업을 명시한다.

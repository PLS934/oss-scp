schema: spec-driven

context: |
  프로젝트는 오픈소스 취약점 관리 플랫폼이다.
  보안팀이 주로 운영·관리하며 담당자를 지정한다.
  개발팀은 관련 취약점 현황을 확인한다.

  여러 유형의 관리 대상에 대한 취약점 현황을 외부 수집처에서
  가져와 통합 관리한다. GitHub 저장소와 단말기는 예상 대상의
  예시이며, 대상 유형과 수집처는 추가되거나 변경될 수 있다.
  구체적인 연동 대상은 후속 설계에서 정한다.
  서버는 Node.js 24 LTS, TypeScript + NestJS, pnpm workspace를 사용한다.
  클라이언트는 TypeScript + React + Vite로 구성한다.
  앱 개발은 로컬에서 진행하며 Docker는 배포 및 개발 도구 없는 환경의 실행용이다.
  서버 실행·도구 버전은 docs/server-development.md,
  검증 결과는 docs/server-verification.md를 따른다.

  담당자 지정은 플랫폼에서 관리한다.
  조치 상태는 외부 데이터를 활용하는 것을 기본 방향으로 하며,
  제공 여부와 의미는 각 연동에서 확인한다.

  모든 산출물의 본문은 한국어로 작성한다.
  OpenSpec 구조 제목과 SHALL/MUST 키워드는 영어로 유지한다.
  확정된 요구사항과 가정, 미결정 사항을 구분한다.

rules:
  proposal:
    - 해결할 문제, 사용자, 기대 효과를 명시한다.
    - 변경 범위와 제외 범위를 명시한다.
    - 미확정 기능이나 기술을 기존 결정처럼 서술하지 않는다.
  specs:
    - 요구사항은 관찰 가능하고 검증 가능한 동작으로 작성한다.
    - 관련된 역할별 접근 범위와 정상·실패 시나리오를 명시한다.
    - 외부에서 제공하는 정보와 플랫폼에서 관리하는 정보를 구분한다.
  design:
    - 주요 설계 선택의 근거와 대안, 제약을 설명한다.
    - 연동 변경은 대상 유형, 수집처별 변환, 내부 모델의 경계를 설명한다.
    - 데이터 연동 시 식별 기준, 중복, 갱신, 누락, 실패 처리를 검토한다.
    - 외부 데이터 갱신이 플랫폼의 담당자 지정 정보에 미치는 영향을 검토한다.
    - 확장성은 현재 요구에 필요한 경계로 확보하고 불필요한 추상화는 피한다.
  tasks:
    - 작업을 완료 여부를 확인할 수 있는 단위로 나눈다.
    - 작업 의존성과 관련 검증 항목을 포함한다.
    - 미결정 사항으로 진행할 수 없는 작업은 선행 결정을 명시한다.
    - 기능 추가·동작 변경에는 자동화 테스트 추가 또는 수정 작업을 포함한다.
    - 버그 수정에는 해당 버그의 재발을 방지하는 회귀 테스트를 포함한다.

operations:
  apply:
    guidance:
      - 테스트·린트·빌드 등 자동 검증은 GitHub Actions로 실행하도록 구성한다. 관련 검증 방식이 변경되면 CI 워크플로도 함께 수정한다.
      - 구현 전에 관련 명세와 설계, 기존 구현을 확인한다.
      - 미확정 외부 데이터 형식을 사실로 가정하지 않고 가정을 명시한다.
      - 대상 유형이나 수집처 추가 시 기존 연동에 대한 영향을 확인한다.
      - 기능 추가·동작 변경·버그 수정 시 관련 자동화 테스트를 반드시 추가하거나 수정한다.
      - 정상 동작뿐 아니라 변경과 관련된 주요 실패 조건도 검증한다.
      - 관련 테스트를 실행하고 결과를 보고한다. 실행하지 못했다면 이유를 명시한다.
      - 문서 등 실행 동작에 영향이 없는 변경은 테스트 코드 추가를 생략할 수 있으며, 적절한 검증을 수행한다.
      - 변경 범위에 맞는 검증을 수행하고 결과와 미검증 항목을 보고한다.
      - 구현과 명세가 불일치하면 이를 명시하고 일관되게 정리한다.
  archive:
    guidance:
      - 작업 완료 여부와 검증 결과, 미해결 사항을 확인한다.
      - 변경 명세의 본 명세 반영 필요 여부와 반영 상태를 확인한다.
      - 남은 작업이 있으면 완료된 것으로 보고하지 않는다.
      - 완료 범위와 후속 과제를 간결하게 요약한다.

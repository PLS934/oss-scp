# Compose 2.24.4 이상: !override로 배포용 공개 포트를 완전히 교체합니다.
# workspace 추가 시 세 서비스 각각에 전용 node_modules 볼륨을 추가합니다.
# pnpm test:docker:workspace가 pnpm의 실제 패키지 목록으로 누락·공유를 검사합니다.
x-dev-build: &dev-build
  context: .
  dockerfile: Dockerfile.dev

services:
  api:
    image: oss-scp-api:dev
    build: *dev-build
    working_dir: /workspace
    init: true
    environment: !override
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3000"
      TSC_WATCHFILE: ${TSC_WATCHFILE:-UseFsEvents}
      PLATFORM_DB_TYPE: postgres
      PLATFORM_DB_HOST: postgres
      PLATFORM_DB_PORT: "5432"
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME:-oss_scp}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER:-oss_scp_app}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD must be set}
      PLATFORM_DB_TLS_MODE: disable
    command: ["sh", "-c", "pnpm install --frozen-lockfile && pnpm --filter @oss-scp/platform-db build && exec pnpm --filter @oss-scp/api exec nest start --watch --path tsconfig.dev.json"]
    volumes:
      - .:/workspace
      - api_root_modules:/workspace/node_modules
      - api_modules:/workspace/apps/api/node_modules
      - api_collector_cli_modules:/workspace/apps/collector-cli/node_modules
      - api_web_modules:/workspace/apps/web/node_modules
      - api_mock_modules:/workspace/apps/mock-api/node_modules
      - api_plugin_config_modules:/workspace/packages/plugin-config/node_modules
      - api_plugin_sdk_modules:/workspace/packages/plugin-sdk/node_modules
      - api_collection_engine_modules:/workspace/packages/collection-engine/node_modules
      - api_http_collector_modules:/workspace/packages/http-collector/node_modules
      - api_platform_db_modules:/workspace/packages/platform-db/node_modules
      - api_platform_db_dist:/workspace/packages/platform-db/dist
      - api_csv_reader_modules:/workspace/packages/csv-reader/node_modules
      - api_local_csv_source_modules:/workspace/packages/local-csv-source/node_modules
      - api_sample1_plugin_modules:/workspace/plugins/sample1-offset-api/node_modules
      - api_sample2_plugin_modules:/workspace/plugins/sample2-single-api/node_modules
      - api_csv_plugin_modules:/workspace/plugins/vulnerabilities-local-csv/node_modules
    healthcheck:
      test: ["CMD", "node", "apps/api/healthcheck.mjs"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 6
  web:
    image: oss-scp-web:dev
    build: *dev-build
    working_dir: /workspace
    init: true
    environment: !override
      NODE_ENV: development
      API_PROXY_TARGET: http://api:3000
      WATCH_POLLING: ${WATCH_POLLING:-false}
    command: ["sh", "-c", "pnpm install --frozen-lockfile && exec pnpm --filter @oss-scp/web dev --host 0.0.0.0 --port 8080"]
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      - .:/workspace
      - web_root_modules:/workspace/node_modules
      - web_api_modules:/workspace/apps/api/node_modules
      - web_collector_cli_modules:/workspace/apps/collector-cli/node_modules
      - web_modules:/workspace/apps/web/node_modules
      - web_mock_modules:/workspace/apps/mock-api/node_modules
      - web_plugin_config_modules:/workspace/packages/plugin-config/node_modules
      - web_plugin_config_dist:/workspace/packages/plugin-config/dist
      - web_plugin_sdk_modules:/workspace/packages/plugin-sdk/node_modules
      - web_plugin_sdk_dist:/workspace/packages/plugin-sdk/dist
      - web_collection_engine_modules:/workspace/packages/collection-engine/node_modules
      - web_http_collector_modules:/workspace/packages/http-collector/node_modules
      - web_platform_db_modules:/workspace/packages/platform-db/node_modules
      - web_csv_reader_modules:/workspace/packages/csv-reader/node_modules
      - web_local_csv_source_modules:/workspace/packages/local-csv-source/node_modules
      - web_sample1_plugin_modules:/workspace/plugins/sample1-offset-api/node_modules
      - web_sample1_plugin_dist:/workspace/plugins/sample1-offset-api/dist
      - web_sample2_plugin_modules:/workspace/plugins/sample2-single-api/node_modules
      - web_sample2_plugin_dist:/workspace/plugins/sample2-single-api/dist
      - web_csv_plugin_modules:/workspace/plugins/vulnerabilities-local-csv/node_modules
      - web_csv_plugin_dist:/workspace/plugins/vulnerabilities-local-csv/dist
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 6

  mock-api:
    image: oss-scp-mock-api:dev
    build: *dev-build
    working_dir: /workspace
    init: true
    environment: !override
      NODE_ENV: development
      MOCK_HOST: 0.0.0.0
      MOCK_PORT: "3001"
    command: ["sh", "-c", "pnpm install --frozen-lockfile && exec pnpm dev:mock"]
    volumes:
      - .:/workspace
      - mock_root_modules:/workspace/node_modules
      - mock_modules:/workspace/apps/mock-api/node_modules
      - mock_dist:/workspace/apps/mock-api/dist
      - mock_api_modules:/workspace/apps/api/node_modules
      - mock_collector_cli_modules:/workspace/apps/collector-cli/node_modules
      - mock_web_modules:/workspace/apps/web/node_modules
      - mock_plugin_config_modules:/workspace/packages/plugin-config/node_modules
      - mock_plugin_sdk_modules:/workspace/packages/plugin-sdk/node_modules
      - mock_collection_engine_modules:/workspace/packages/collection-engine/node_modules
      - mock_http_collector_modules:/workspace/packages/http-collector/node_modules
      - mock_platform_db_modules:/workspace/packages/platform-db/node_modules
      - mock_csv_reader_modules:/workspace/packages/csv-reader/node_modules
      - mock_local_csv_source_modules:/workspace/packages/local-csv-source/node_modules
      - mock_sample1_plugin_modules:/workspace/plugins/sample1-offset-api/node_modules
      - mock_sample2_plugin_modules:/workspace/plugins/sample2-single-api/node_modules
      - mock_csv_plugin_modules:/workspace/plugins/vulnerabilities-local-csv/node_modules
    healthcheck:
      test: ["CMD", "node", "apps/mock-api/healthcheck.mjs"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 12

volumes:
  web_plugin_config_dist:
  web_plugin_sdk_dist:
  web_sample1_plugin_dist:
  web_sample2_plugin_dist:
  web_csv_plugin_dist:
  api_collector_cli_modules:
  web_collector_cli_modules:
  mock_collector_cli_modules:
  api_plugin_sdk_modules:
  web_plugin_sdk_modules:
  mock_plugin_sdk_modules:
  api_collection_engine_modules:
  web_collection_engine_modules:
  mock_collection_engine_modules:
  api_sample1_plugin_modules:
  web_sample1_plugin_modules:
  mock_sample1_plugin_modules:
  api_sample2_plugin_modules:
  web_sample2_plugin_modules:
  mock_sample2_plugin_modules:
  api_csv_plugin_modules:
  web_csv_plugin_modules:
  mock_csv_plugin_modules:
  api_http_collector_modules:
  web_http_collector_modules:
  mock_http_collector_modules:
  api_platform_db_dist:
  api_local_csv_source_modules:
  web_local_csv_source_modules:
  mock_local_csv_source_modules:
  api_mock_modules:
  api_csv_reader_modules:
  api_plugin_config_modules:
  api_platform_db_modules:
  web_mock_modules:
  web_csv_reader_modules:
  web_plugin_config_modules:
  web_platform_db_modules:
  mock_root_modules:
  mock_modules:
  mock_dist:
  mock_api_modules:
  mock_web_modules:
  mock_csv_reader_modules:
  mock_plugin_config_modules:
  mock_platform_db_modules:
  api_root_modules:
  api_modules:
  api_web_modules:
  web_root_modules:
  web_api_modules:
  web_modules:

# Compose 2.24.4 이상: !override로 배포용 공개 포트를 완전히 교체합니다.
x-dev-build: &dev-build
  context: .
  dockerfile: Dockerfile.dev

services:
  api:
    image: oss-scp-api:dev
    build: *dev-build
    working_dir: /workspace
    init: true
    environment: !override
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3000"
      TSC_WATCHFILE: ${TSC_WATCHFILE:-UseFsEvents}
    command: ["sh", "-c", "pnpm install --frozen-lockfile && exec pnpm --filter @oss-scp/api exec nest start --watch --path tsconfig.dev.json"]
    volumes:
      - .:/workspace
      - api_root_modules:/workspace/node_modules
      - api_modules:/workspace/apps/api/node_modules
      - api_web_modules:/workspace/apps/web/node_modules
    healthcheck:
      test: ["CMD", "node", "apps/api/healthcheck.mjs"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 6
  web:
    image: oss-scp-web:dev
    build: *dev-build
    working_dir: /workspace
    init: true
    environment: !override
      NODE_ENV: development
      API_PROXY_TARGET: http://api:3000
      WATCH_POLLING: ${WATCH_POLLING:-false}
    command: ["sh", "-c", "pnpm install --frozen-lockfile && exec pnpm --filter @oss-scp/web dev --host 0.0.0.0 --port 8080"]
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      - .:/workspace
      - web_root_modules:/workspace/node_modules
      - web_api_modules:/workspace/apps/api/node_modules
      - web_modules:/workspace/apps/web/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 6

volumes:
  api_root_modules:
  api_modules:
  api_web_modules:
  web_root_modules:
  web_api_modules:
  web_modules:

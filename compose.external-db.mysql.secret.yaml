services:
  api:
    environment: !override
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - OSS_SCP_CONFIG_ROOT=/config
      - PLATFORM_DB_TYPE=mysql
      - PLATFORM_DB_HOST
      - PLATFORM_DB_PORT
      - PLATFORM_DB_NAME
      - PLATFORM_DB_USER
      - PLATFORM_DB_PASSWORD_FILE=/run/secrets/platform_db_password
      - PLATFORM_DB_TLS_MODE
      - PLATFORM_DB_TLS_CA_FILE
      - PLATFORM_DB_POOL_MAX
      - PLATFORM_DB_CONNECT_TIMEOUT_MS
    secrets:
      - platform_db_password

secrets:
  platform_db_password:
    file: ${PLATFORM_DB_PASSWORD_FILE_HOST:?PLATFORM_DB_PASSWORD_FILE_HOST must be set}

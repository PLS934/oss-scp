# 검증 환경: Ubuntu 24.04 (linux/amd64). 실행 결과는 Actions와 PR에서 확인합니다.
name: 서버·클라이언트 통합 검증
on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mysql:
    name: MySQL 8.4.6 연결 및 migration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oss-scp/platform-db test
      # sample1과 HTTP CSV의 수집·가공·저장·실패 재개 계약을 MySQL에서도 검증
      - run: pnpm test:integration:sample1:mysql
  postgres:
    name: PostgreSQL 17.6 연결 및 migration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oss-scp/platform-db test
      # sample1과 HTTP CSV 수집·저장·실패 재개, partial 및 원천 독립 조회 검증
      - run: pnpm test:integration:sample1
  local:
    name: 로컬 개발 및 배포 빌드
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:release
      # JSON offset·single HTTP 수집의 loopback 통합·오류·자원 제한 검증
      - run: pnpm test:http-collector
      # HTTP CSV의 공통 파서 재사용·압축·한도·중단·backpressure 검증
      - run: pnpm test:http-csv-source
      # 수동 CLI 선택·종료 코드·비밀정보 비노출·signal 정리 검증
      - run: pnpm --filter @oss-scp/collector-cli test
      - run: pnpm build
      # 배포 실행·시작 실패·종료 및 임시 복사본의 Nest watch 변경 반영
      - run: pnpm test:process
      - run: pnpm test:process:mock
      - run: pnpm test:process:plugin-config
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
  docker:
    name: Docker 빌드 및 실행
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:docker:workspace
      - run: pnpm test:docker:web
      # Compose·이미지 단독 실행·비루트·개발 파일 제외·무응답 unhealthy 전환
      - run: bash scripts/test-docker.sh
      # 실제 archive load, migration, 두 제품 버전 전환과 DB·설정 보존 검증
      - run: pnpm test:docker:release
      # 폐쇄망 PostgreSQL 포함 번들의 최초 설치·두 버전 업데이트·복구 경계 검증
      - run: pnpm test:docker:bundle
      - run: pnpm test:docker:external-db
      - run: pnpm test:docker:mysql
      - run: pnpm test:docker:mock

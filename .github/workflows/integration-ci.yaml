# 검증 환경: Ubuntu 24.04 (linux/amd64). 실행 결과는 Actions와 PR에서 확인합니다.
name: 서버·클라이언트 통합 검증
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    name: PostgreSQL 17.6 연결 및 migration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oss-scp/platform-db test
  local:
    name: 로컬 개발 및 배포 빌드
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # 배포 실행·시작 실패·종료 및 임시 복사본의 Nest watch 변경 반영
      - run: pnpm test:process
      - run: pnpm test:process:mock
      - run: pnpm test:process:plugin-config
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
  docker:
    name: Docker 빌드 및 실행
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:docker:workspace
      - run: pnpm test:docker:web
      # Compose·이미지 단독 실행·비루트·개발 파일 제외·무응답 unhealthy 전환
      - run: bash scripts/test-docker.sh
      - run: pnpm test:docker:external-db
      - run: pnpm test:docker:mock

# 검증 환경: Ubuntu 24.04 (linux/amd64). 실행 결과는 Actions와 PR에서 확인합니다.
name: 서버·클라이언트 통합 검증
run-name: "${{ github.event_name == 'workflow_dispatch' && format('PR #{0} · {1}', inputs.pr_number, inputs.expected_sha) || github.workflow }}"
on:
  workflow_call:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: 검증할 PR 번호
        required: true
        type: number
      expected_sha:
        description: 검증할 PR head commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: integration-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dispatch-guard:
    name: 수동 실행 대상 검증
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: PR head SHA 확인
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha는 40자리 소문자 commit SHA여야 합니다." >&2
            exit 1
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          actual_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          state="$(jq -r '.state' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"

          if [[ "$state" != "open" || "$draft" == "true" ]]; then
            echo "열린 non-draft PR만 검증할 수 있습니다." >&2
            exit 1
          fi
          if [[ "$base_ref" != "main" || "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "이 저장소의 main을 대상으로 하는 내부 브랜치 PR만 검증할 수 있습니다." >&2
            exit 1
          fi
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "PR head가 요청한 SHA와 다릅니다: expected=$EXPECTED_SHA actual=$actual_sha" >&2
            exit 1
          fi
      - name: PR에 CI 실행 중 상태 기록
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            -f state=pending \
            -f context='agent-gated/integration-ci' \
            -f description='에이전트 리뷰 완료 · 수동 CI 실행 중' \
            -f target_url="$RUN_URL"
  mysql:
    name: MySQL 8.4.6 연결 및 migration
    needs: dispatch-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oss-scp/platform-db test
      # sample1과 HTTP CSV의 수집·가공·저장·실패 재개 계약을 MySQL에서도 검증
      - run: pnpm test:integration:sample1:mysql
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser:search
        env:
          SEARCH_DB_TYPE: mysql
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: record-search-mysql
          path: test-results/record-search-mysql.json
  postgres:
    name: PostgreSQL 17.6 연결 및 migration
    needs: dispatch-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oss-scp/platform-db test
      # 실제 PostgreSQL의 UNION 라이브 조회·검색·필터·정렬·상세·캐시 계약 검증
      - run: pnpm build:plugin-transforms
      - run: pnpm --filter @oss-scp/api test
      # sample1과 HTTP CSV 수집·저장·실패 재개, partial 및 원천 독립 조회 검증
      - run: pnpm test:integration:sample1
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser:search
        env:
          SEARCH_DB_TYPE: postgres
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: record-search-postgres
          path: test-results/record-search-postgres.json
  local:
    name: 로컬 개발 및 배포 빌드
    needs: dispatch-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:release
      # JSON offset·single HTTP 수집의 loopback 통합·오류·자원 제한 검증
      - run: pnpm test:http-collector
      # HTTP CSV의 공통 파서 재사용·압축·한도·중단·backpressure 검증
      - run: pnpm test:http-csv-source
      # 수동 CLI 선택·종료 코드·비밀정보 비노출·signal 정리 검증
      - run: pnpm --filter @oss-scp/collector-cli test
      - run: pnpm build
      # 배포 실행·시작 실패·종료 및 임시 복사본의 Nest watch 변경 반영
      - run: pnpm test:process
      - run: pnpm test:process:mock
      - run: pnpm test:process:plugin-config
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
  docker:
    name: Docker 빌드 및 실행
    needs: dispatch-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:docker:workspace
      - run: pnpm test:docker:web
      # Compose·이미지 단독 실행·비루트·개발 파일 제외·무응답 unhealthy 전환
      - run: bash scripts/test-docker.sh
      # 실제 archive load, migration, 두 제품 버전 전환과 DB·설정 보존 검증
      - run: pnpm test:docker:release
      # 폐쇄망 PostgreSQL 포함 번들의 최초 설치·두 버전 업데이트·복구 경계 검증
      - run: pnpm test:docker:bundle
      - run: pnpm test:docker:external-db
      - run: pnpm test:docker:mysql
      - run: pnpm test:docker:mock
  report-status:
    name: PR CI 상태 기록
    needs:
      - dispatch-guard
      - mysql
      - postgres
      - local
      - docker
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.dispatch-guard.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: PR에 최종 CI 상태 기록
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MYSQL_RESULT: ${{ needs.mysql.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          LOCAL_RESULT: ${{ needs.local.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          state=success
          description='에이전트 승인 SHA의 수동 CI 성공'

          for result in \
            "$MYSQL_RESULT" \
            "$POSTGRES_RESULT" \
            "$LOCAL_RESULT" \
            "$DOCKER_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              state=failure
              description='수동 CI 실패 · 실행 결과 확인 필요'
              break
            fi
          done

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            -f state="$state" \
            -f context='agent-gated/integration-ci' \
            -f description="$description" \
            -f target_url="$RUN_URL"

# 검증 환경: Ubuntu 24.04 (linux/amd64). 실행 결과는 Actions와 PR에서 확인합니다.
name: 서버·클라이언트 통합 검증
on:
  workflow_call:
    inputs:
      full:
        description: 재사용 호출의 전체 검증 여부
        type: boolean
        default: true
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: 변경 범위 확인
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      bundle: ${{ steps.scope.outputs.bundle }}
      mock: ${{ steps.scope.outputs.mock }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/ci-scope.test.mjs
      - id: scope
        name: 실행할 검증 결정
        env:
          CI_FULL: ${{ inputs.full == true }}
        run: node scripts/ci-scope.mjs
  mysql:
    needs: changes
    # 기존 필수 체크 이름을 유지하고, 감지 실패는 성공/skip으로 숨기지 않는다.
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    name: MySQL 8.4.6 연결 및 migration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 변경 감지 성공 확인
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # sample1과 HTTP CSV의 수집·가공·저장·실패 재개 계약을 MySQL에서도 검증
      - run: pnpm test:integration:sample1:mysql
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser:search
        env:
          SEARCH_DB_TYPE: mysql
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: record-search-mysql
          path: test-results/record-search-mysql.json
  postgres:
    needs: changes
    # 기존 필수 체크 이름을 유지하고, 감지 실패는 성공/skip으로 숨기지 않는다.
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    name: PostgreSQL 17.6 연결 및 migration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 변경 감지 성공 확인
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # sample1과 HTTP CSV 수집·저장·실패 재개, partial 및 원천 독립 조회 검증
      - run: pnpm test:integration:sample1
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser:search
        env:
          SEARCH_DB_TYPE: postgres
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: record-search-postgres
          path: test-results/record-search-postgres.json
  local:
    needs: changes
    # 기존 필수 체크 이름을 유지하고, 감지 실패는 성공/skip으로 숨기지 않는다.
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    name: 로컬 개발 및 배포 빌드
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 변경 감지 성공 확인
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # DB 양쪽 어댑터와 HTTP collector·CSV·CLI를 포함한 workspace 테스트는 한 번만 실행
      - run: pnpm test
      - run: pnpm test:release
      - run: pnpm build
      # 배포 실행·시작 실패·종료 및 임시 복사본의 Nest watch 변경 반영
      - run: pnpm test:process
      - run: pnpm test:process:mock
      - run: pnpm test:process:plugin-config
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
  docker:
    needs: changes
    # 기존 필수 체크 이름을 유지하고, 감지 실패는 성공/skip으로 숨기지 않는다.
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    name: Docker 빌드 및 실행
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 변경 감지 성공 확인
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:docker:workspace
      - run: pnpm test:docker:web
      # Compose·이미지 단독 실행·비루트·개발 파일 제외·무응답 unhealthy 전환
      - run: bash scripts/test-docker.sh
      # 실제 archive load, migration, 두 제품 버전 전환과 DB·설정 보존 검증
      - if: needs.changes.outputs.bundle == 'true'
        run: pnpm test:docker:release
      # 폐쇄망 PostgreSQL 포함 번들의 최초 설치·두 버전 업데이트·복구 경계 검증
      - if: needs.changes.outputs.bundle == 'true'
        run: pnpm test:docker:bundle
      - run: pnpm test:docker:external-db
      - run: pnpm test:docker:mysql
      - if: needs.changes.outputs.mock == 'true'
        run: pnpm test:docker:mock
